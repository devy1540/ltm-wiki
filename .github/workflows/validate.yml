name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  static-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Validate Agent Skills specification
        run: >-
          uvx
          --from 'git+https://github.com/agentskills/agentskills@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref'
          skills-ref validate skills/llm-wiki
      - name: Validate plugin package
        run: python3 -m unittest tests/test_plugin_package.py
      - name: Validate repository contracts and golden fixture
        run: sh tests/verify-repository.sh
